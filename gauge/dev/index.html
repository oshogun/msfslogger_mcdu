<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSFSLOGGER gauge development</title>
<style>
body { margin: 0; background: #15191e; color: #eee; font: 15px system-ui; }
header { padding: 16px 24px; background: #242b34; }
h1 { font-size: 20px; margin: 0 0 8px; }
select, button { padding: 6px; margin-right: 16px; }
iframe { display: block; width: 600px; height: 900px; max-width: 100%; border: 0; margin: 20px auto; background: #15191e; }
#connection { color: #ffd184; }
</style>
<header>
<h1>MSFSLOGGER · Gauge development</h1>
<p>Browser preview · simulated host data · configuration resets on reload</p>
<label>Scenario <select id="scenario">
<option value="stopped">Stopped</option><option value="online">Online</option>
<option value="retry">Sim reconnect</option><option value="offline">Server unreachable</option>
<option value="unauthorized">Unauthorized</option><option value="paused">Full pause</option>
<option value="active-pause">Active pause</option><option value="crashed">Host crash</option>
</select></label>
<label>Datalink <select id="datalink-scenario">
<option value="flight">Flight scope</option><option value="leg">Leg scope</option>
<option value="no-flight-plan">No flight plan</option><option value="pre-upgrade">Pre-upgrade server</option>
<option value="invalid-token">Invalid token</option><option value="unreachable">Unreachable</option>
<option value="long-taf">Long TAF</option><option value="long-route">900-char route</option>
<option value="no-dispatch">No dispatch (409)</option><option value="canned-four">Four canned</option>
<option value="wx-unavailable">WX unavailable</option><option value="sidecar-outdated">Sidecar outdated</option>
</select></label>
<label>SimBrief <select id="simbrief-scenario">
<option value="configured">Pilot ID configured</option>
<option value="not-configured">Pilot ID not set</option><option value="duplicate">Already filed</option>
<option value="long-label">Long label</option><option value="prefiled">Leg already prefiled</option>
<option value="no-user-id">No user id (400)</option><option value="unknown-user">Unknown user (400)</option>
<option value="no-plan">No OFP (404)</option><option value="simbrief-timeout">SimBrief timeout (504)</option>
<option value="network">SimBrief network (502)</option>
<option value="bad-status">SimBrief bad status (502)</option>
<option value="bad-body">SimBrief bad body (502)</option><option value="db-error">DB error (500)</option>
<option value="unknown-code">Unknown code (409)</option><option value="invalid-token">Invalid token</option>
<option value="token-missing">Token not received</option>
<option value="unavailable">Pre-SimBrief server</option><option value="rejected">Rejected (403)</option>
<option value="bad-response">Bad response</option><option value="tls-error">TLS error</option>
<option value="unreachable">Unreachable</option><option value="client-timeout">Sidecar HTTP timeout</option>
<option value="relay-timeout">Shell relay timeout</option><option value="no-config">No config</option>
<option value="in-progress">Prefile in progress</option><option value="busy">Sidecar busy</option>
<option value="sidecar-exited">Sidecar exited</option>
<option value="sidecar-unavailable">Sidecar unavailable</option>
<option value="sidecar-outdated">Sidecar outdated</option><option value="not-supported">Not supported</option>
</select></label>
<label>Viewport <select id="size"><option value="600">600 px</option><option value="480">480 px</option><option value="800">800 px</option></select></label>
<button id="reload">Reload</button><label><input type="checkbox" id="auto" checked> Reload on save</label>
<p>F12 opens DevTools. Select the CDU iframe context to inspect <code>window.gaugeDev</code>. <span id="connection"></span></p>
</header>
<iframe id="gauge" title="CDU gauge preview" src="/ui/index.html"></iframe>
<script src="/gauge/dev/preview.js"></script>
</html>
