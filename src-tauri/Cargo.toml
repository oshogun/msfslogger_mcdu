[package]
name = "msfslogger-windows-client"
version = "0.1.0"
description = "MSFS flight logger uplink panel"
edition = "2021"
rust-version = "1.88.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
custom-protocol = ["tauri/custom-protocol"]
